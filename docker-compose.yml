services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://faisal:faisal06@postgres:5432/researchmind
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - chroma_data:/app/chroma_db

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=faisal
      - POSTGRES_PASSWORD=faisal06
      - POSTGRES_DB=researchmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  chroma_data:
